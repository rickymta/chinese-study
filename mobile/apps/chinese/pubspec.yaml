name: af_chinese
description: "AntFarm — học tiếng Trung"
publish_to: none
resolution: workspace
# Phiên bản + build number: dùng cho X-AF-Client (`chinese-mobile/0.1.0+1 (android)`), versionName/CFBundleVersion.
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  af_auth: ^0.1.0
  af_core: ^0.1.0
  af_ui: ^0.1.0
  cupertino_icons: 1.0.8
  dio: 5.11.1
  flutter_riverpod: 3.4.3
  go_router: 18.0.1
  # `any`: SDK flutter_localizations đã ghim intl — để resolver chọn đúng bản của SDK.
  intl: any

dev_dependencies:
  af_lints: ^0.1.0
  flutter_test:
    sdk: flutter
  mocktail: 1.0.5

flutter:
  uses-material-design: true
  # Dữ liệu nét chữ (M10.1, tập con hanzi-writer-data + ARPHICPL.TXT + NOTICE.md) và giấy phép hanzi-writer (MIT).
  assets:
    - assets/hanzi-data/
    - assets/licenses/
