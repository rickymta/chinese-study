# nginx trong container chinese-frontend — CHỈ phục vụ file tĩnh (hợp đồng §5.6.4).
# ⚠️ CHƯA VERIFY bằng Docker — checklist deploy/VERIFY-DOCKER.md mục 6 (file .mjs trả application/javascript).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Redirect tương đối — tránh nginx tự sinh http:// khi đứng sau nginx biên HTTPS.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Header bảo mật cơ bản — server-level KẾ THỪA xuống mọi location, TRỪ location nào tự khai
    # add_header riêng (nginx không gộp add_header giữa các cấp, cấp con có add_header thì cấp con
    # đó CHỈ dùng bộ add_header của chính nó) — vì vậy phải LẶP LẠI 3 dòng này ở mọi location bên
    # dưới có add_header riêng (.mjs, /assets/, = /index.html).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # mime.types của nginx (kể cả 1.27) KHÔNG khai .mjs ⇒ rơi về application/octet-stream ⇒ trình duyệt từ chối
    # module script ("Failed to fetch dynamically imported module" — đọc y hệt 404, dev không tái hiện vì Vite tự
    # đặt Content-Type đúng). Khối riêng với default_type — KHÔNG dùng `types {}` ở server level (ghi đè toàn bộ
    # bảng MIME kế thừa, mất luôn css/ảnh/font).
    location ~* \.mjs$ {
        default_type application/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Bundle có hash trong tên ⇒ cache bất biến.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # SPA fallback. KHÔNG proxy API ở đây — nginx biên đã tách /chinese/ → gateway trước khi tới container này;
    # identity ở id.antfarms.xyz (trình duyệt gọi thẳng, CORS do identity-service trả).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
